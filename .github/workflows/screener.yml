name: Daily Swing Screener

on:
  schedule:
    # 22:50 UTC on weekdays, after the breadth update has finished
    - cron: '50 22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas

      - name: Run screener
        run: python swing_screener.py

      - name: Commit and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screener.json docs/screener_charts.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔎 Daily swing screener $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
